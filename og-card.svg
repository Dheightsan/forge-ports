<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modwright: Minecraft mod porting and backporting, Forge 1.20.1 specialist">
  <defs>
    <radialGradient id="bg" cx="0.22" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#2a1d10"/>
      <stop offset="0.5" stop-color="#1a130c"/>
      <stop offset="1" stop-color="#100e0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c07e3c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c07e3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="250" cy="120" rx="560" ry="380" fill="url(#glow)"/>
  <!-- La marca es el cuy desde 2026-08-16. Antes habia un hexagono dibujado a
       mano aqui: la tarjeta del enlace ensenaba una marca que no existe en
       ninguna otra parte, ni en la cabecera ni en la pestana del navegador.
       La caja mide 96 y el dibujo trae un 4% de aire propio, asi que el cuy se
       ve a ~88. El rotulo se movio de x=68 a x=110 para dejarle sitio.

       96 y no 64: Discord y X pintan la tarjeta a unos 500 px de ancho, o sea
       que aqui se divide por 2,4. A 64 el logo llegaba al lector a 27 px y no
       se reconocia; a 96 llega a 40. La caja va centrada con el rotulo: el
       texto es de 42 px, su altura de mayusculas cae en y=23,3 local, asi que
       la caja empieza en 23,3-48 = -24,7. -->
  <g transform="translate(80,66)">
    <image href="logo-cuy-v3.png" x="0" y="-24.7" width="96" height="96"/>
    <text x="110" y="38" font-family="Space Grotesk, system-ui, sans-serif" font-size="42" font-weight="700" fill="#eae4d6">Modwright</text>
  </g>
  <text x="80" y="312" font-family="Space Grotesk, system-ui, sans-serif" font-size="72" font-weight="700" fill="#e8dcc4">Port, backport &amp; <tspan fill="#5fb84a">revive</tspan></text>
  <text x="80" y="394" font-family="Space Grotesk, system-ui, sans-serif" font-size="72" font-weight="700" fill="#e8dcc4"><tspan fill="#79bd45">Minecraft</tspan> mods</text>
  <text x="80" y="466" font-family="Space Grotesk, system-ui, sans-serif" font-size="40" font-weight="600" fill="#b9a78c">any version, <tspan fill="#79bd45">any loader</tspan></text>
  <text x="80" y="556" font-family="Space Grotesk, system-ui, sans-serif" font-size="26" font-weight="500" fill="#8c7a60">Forge 1.20.1 specialist  ·  from $20  ·  fixed written quote  ·  license-checked</text>
  <rect x="0" y="618" width="1200" height="12" fill="#b9742f"/>
</svg>
